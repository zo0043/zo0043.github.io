{{- /*
  站点底部自定义内容

  图片放大（medium-zoom）按需加载（2026-09-30 性能审核后定）：
  仅当页面确实含 <img> 时才从 CDN 加载该库。此前无条件加载，
  而 15 篇系列文章一张 <img> 都没有（图表全部是内联 SVG），
  对它们是纯粹的额外请求。
*/ -}}
{{- $hasImg := false -}}
{{- with .Content }}{{ if strings.Contains . "<img" }}{{ $hasImg = true }}{{ end }}{{ end -}}
{{- if $hasImg }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/medium-zoom/1.1.0/medium-zoom.min.js"
  integrity="sha512-9ZKhgaFdKlsELap/dGw3Iaz5Bj+Las0XXZiRKYZaN9QArg6FtkD5rULNmNH4rTCTFxjPiBGr3MX8smRADRorDA=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
  const images = Array.from(document.querySelectorAll(".post-content img"));
  images.forEach(img => {
    mediumZoom(img, {
      margin: 1, /* 留一点余地，防止四舍五入导致放大略超窗口、露出横向滚动条 */
      container: null,
      template: null,
    });
  });
</script>
{{- end }}

<script>
  var OSName = "unknown";
  var navApp = navigator.userAgent.toLowerCase();
  switch (true) {
    case (navApp.indexOf("win") != -1):
      OSName = "windows";
      break;
    case (navApp.indexOf("mac") != -1):
      OSName = "apple";
      break;
    case (navApp.indexOf("linux") != -1):
      OSName = "linux";
      break;
    case (navApp.indexOf("x11") != -1):
      OSName = "unix";
      break;
  }

  if (OSName == "windows") {
    document.body.className += ' win11'
  }
</script>
